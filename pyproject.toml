[project]
name = "nonebot-plugin-feature-switch"
version = "0.1.0"
description = "Per-feature, per-group feature switch and matcher gate for NoneBot2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["nonebot2>=2.5,<2.6", "nonebot-adapter-onebot>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/MortisBot/nonebot-plugin-feature-switch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_feature_switch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
